# Turnuva dalga 20b — gün içi ivme, QQQ 30 dk (Alpaca SIP, 2016+, uzatılmış seans barlarıyla): ÖN KAYIT. Gerekçe:
# docs/turnuva/Dalga-20b-QQQ-30dk.md. Gao ve ark.'nın özgün "son yarım saat" tanımı; aile dalga 20 ile ortak (DSR 8 deneme).

dalga: 20b
veri_bitis: "2026-01-01"        # 2026-01 → kör (seçilen varyant sonradan ölçülür; bilgi, kapı değil)
frenler: true
boyut:
  hedef_vol: 0.25
  kaldirac: 1.0
  vol_pencere_gun: 60
  bant: 0.0
walk_forward: { is_yil: 3, oos_yil: 1 }
# Çıta 0: kol zamanın ~%4–8'inde pozisyondadır; backtest nakdi faizsiz sayar (aleyhte), gerçek hesapta nakit bacağı
# faizi ayrıca kazanır. Ölçülen getiri saf gün içi fazla getiridir (dalga 11'deki çoğunlukla nakitte kalan kollar gibi).
olcut: { dsr_a: 0.95, dsr_b: 0.0, yil_pozitif: 0.60, rejim_t: -2.0, stres_maliyet: 2.0, risksiz_yillik: 0.0 }

planlar:
  gun_ici_ivme:
    kimlik: 2026-10-18-d20b-gun-ici-ivme-qqq-30dk
    hipotez: >-
      QQQ'da (30 dk, Alpaca) günün ilk yarım saatinin getirisi (önceki 16:00 NY → 10:00 NY) son yarım saatin ya da son
      saatin (15:30/15:00 → 16:00 NY) yönünü öngörür (Gao, Han, Li, Zhou 2018, JFE). QQQ maliyeti (gidiş-dönüş 4 bps) sonrası pozitif ve walk-forward'da
      kalıcıdır. Yeni aile. Sıfır hipotezi: değildir.

gruplar:
  qqq_30dk:
    kimlikler: [ARCA:QQQ]
    depo: alpaca
    seans: XNYS
    maliyet_modeli: ABD:qqq_gun_ici
    asgari_gecmis_gun: 60
    yon: long_short
    zd: [30m]

# 4 deneme
kollar:
  - strateji: gun_ici_ivme_dk
    gruplar: [qqq_30dk]
    zd: [30m]
    izgara: { tutma_dk: [30, 60], kisa: [false, true] }
