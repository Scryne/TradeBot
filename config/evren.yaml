# İlk dalga evreni (Final Doküman §Veri). Enstrüman kimliği = "<PIYASA>:<SEMBOL>".
# takvim: kripto_7x24 | fx_24x5 | XNYS | XIST     (borsa takvimleri exchange_calendars'tan)
# Kripto evreni dinamiktir: Binance'teki tüm USDT spot çiftleri (tarihsel evren: ilk/son mum tarihiyle).
# Yürütme doğrulaması (1 dk) yalnız `dakikalik: true` olanlar için indirilir (Spike 02: Nautilus parity).

kripto:
  piyasa: BINANCE
  sinif: kripto
  takvim: kripto_7x24
  para_birimi: USDT
  dinamik_evren: usdt_spot          # exchangeInfo'daki tüm USDT çiftleri (işlemde olmayanlar dahil, delist için)
  temel_zaman_dilimi: 1h            # tüm evren için saatlik; 4h/1d buradan türetilir
  dakikalik: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, TRXUSDT, LINKUSDT, AVAXUSDT]
  funding: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, LINKUSDT, AVAXUSDT, LTCUSDT]

dukascopy:
  piyasa: DUKASCOPY
  takvim: fx_24x5
  baslangic: "2010-01"
  temel_zaman_dilimi: 1h            # BID saatlik tam geçmiş (aylık dosya); spread = ASK - BID
  ask_yil: 3                        # ASK saatlik yalnız son 3 yıl (spread/maliyet modeli için)
  # Dakikalık BID yalnız yürütme doğrulaması için (Spike 02), son 3 yıl. Dukascopy hız sınırı çok sıkı (≥ 6 sn/istek).
  dakikalik: [EURUSD, XAUUSD, USA500IDXUSD]
  dakikalik_yil: 3
  semboller:
    fx:     { para: USD, liste: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD, EURJPY, EURGBP, USDTRY] }
    metal:  { para: USD, liste: [XAUUSD, XAGUSD] }
    endeks: { liste: { USA500IDXUSD: USD, USATECHIDXUSD: USD, USA30IDXUSD: USD, DEUIDXEUR: EUR, GBRIDXGBP: GBP, JPNIDXJPY: JPY } }
    emtia:  { para: USD, liste: [BRENTCMDUSD, LIGHTCMDUSD] }

abd_etf:
  piyasa: ARCA                      # kaynak Yahoo; kimlik piyasası birincil borsa gösterimi
  sinif: etf
  takvim: XNYS
  para_birimi: USD
  baslangic: "1993-01-01"
  liste: [SPY, QQQ, IWM, DIA, TLT, IEF, SHY, GLD, SLV, USO, XLF, XLK, XLE, XLV, XLY, XLP, XLI, XLU, XLB, XLRE, XLC,
          EEM, EFA, VNQ, HYG, LQD]

nasdaq:
  # Nasdaq-100'ün 2007'den bugüne bütün üyeleri (Scryne 2026-10-18 yön kararı). Üyelik point-in-time:
  # config/nasdaq.yaml + veri/nasdaq100.py. Kaynak Yahoo günlük (bölünme + temettü düzeltmeli toplam getiri).
  piyasa: NASDAQ
  sinif: hisse
  takvim: XNYS                      # Nasdaq ile aynı işlem günleri, saatler ve yarım günler
  para_birimi: USD
  baslangic: "2006-01-01"

bist:
  piyasa: BIST
  sinif: hisse
  takvim: XIST
  para_birimi: TRY
  baslangic: "2000-01-01"
  endeksler: [XU100, XU030]
  # Hisse listesi: çalışma anında BIST 30 + BIST 100 bileşenleri (borsapy, BUGÜNKÜ liste).
  # SINIR: ücretsiz kaynakta geçmiş endeks üyeliği yok → hayatta kalma yanlılığı. Kalite raporu bunu işaretler;
  # turnuvada BIST kesitsel sonuçları bu uyarıyla okunur.
  bilesen_endeksleri: [XU100]

mt5:
  # NCM Investment MT5 demo (Faz 8, Spike 08). Veri host Windows'taki köprüden (tools/host/mt5kopru.ps1).
  # Kimlik piyasası: NCMFX (forex hesabının CFD'leri) ve VIOP. Barlar MT5 barıdır (BID); `spread` kolonu nokta cinsinden
  # (maliyet modeli), `volume` VİOP'ta gerçek hacim (kontrat), NCMFX'te tik hacmi.
  # 1m her gece biriktirilir (terminal ~2 ay tutar); 1h ve 1d derin geçmiş içindir. 1d, seans gününün 00:00 UTC'sine
  # etiketlenir (MT5'te sunucu gece yarısı = 21:00 UTC).
  zaman_dilimleri: [1m, 1h, 1d]
  derinlik_gun: { 1m: 90, 1h: 3650, 1d: 9000 }
  hesaplar:
    forex:
      piyasa: NCMFX
      gruplar:
        metal:  { takvim: fx_24x5, para: USD, liste: [GOLD, SILVER] }
        fx:     { takvim: fx_24x5, para: USD, liste: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF] }
        # "!" sürekli grafik sembolleri işleme kapalı (yalnız geçmiş); işlem vadeli kontratta (ES6Z…)
        endeks: { takvim: fx_24x5, para: USD, liste: ["ES!", "NQ!", "YM!"] }
        emtia:  { takvim: fx_24x5, para: USD, liste: ["CL!"] }
    viop:
      piyasa: VIOP
      gruplar:
        endeks: { takvim: viop_aksam, para: TRY, liste: [XU30_YAKINVADE] }
        # Vadeli kontratlar önekle bulunur (bugün listelenen her vade); kendi sürekli serimiz bunlardan kurulur
        endeks_vadeli: { takvim: viop_aksam, para: TRY, on_ek: [F_XU030] }
        altin_usd:     { takvim: viop_aksam, para: USD, on_ek: [F_XAUUSD] }
        # TRYUSD_YAKINVADE: yakın vade sürekli döviz (2015-07 → 2026-02'de donmuş; VİOP 2'nin geçmişi)
        doviz_vadeli:  { takvim: viop, para: TRY, liste: [TRYUSD_YAKINVADE], on_ek: [F_USDTRY] }
        altin_try:     { takvim: viop, para: TRY, on_ek: [F_XAUTRYM] }
