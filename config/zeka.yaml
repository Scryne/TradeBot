# Zekâ katmanı (Faz 6). Model sürümleri sabittir; değişiklik ölçümle ve ayrı kararla yapılır.
jev:
  model: jev-1.13.0            # Spike 04-A ile ölçülen sürüm (ts.py kontrol ile yaşadığı doğrulanır)
  esik: 0.5                    # güven < esik → yükseltme (Spike 04 dersi 4)
yukseltme:
  base_url: https://integrate.api.nvidia.com/v1
  # Spike 04-B (2026-09-26): nemotron-3-ultra 90 etiketli örnekte 89/90, 60 gerçek belirsiz vakada veto kararı 60/60
  # (yanlış veto 0, kaçırılan 0); gecikme medyan 12–19 sn, p90 37–64 sn (ücretsiz katman). Sırayla denenen yedek zinciri.
  # Yedek glm-5.3: cevap verdiği 43/43 doğru, ama 47/90 180 sn'de zaman aşımı. kimi-k3 alınmadı: %27 geçersiz çıktı,
  # belirsiz 60'ta 4 kaçırılan veto (kaçırma, yanlış alarmdan pahalı).
  modeller: [nvidia/nemotron-3-ultra-550b-a55b, z-ai/glm-5.3]
  zaman_asimi_sn: 180          # ücretsiz katmanda p90 64 sn ölçüldü
kaynaklar: [binance_duyuru, kap, rss]  # servis turunda toplanan kaynaklar (rol: A1, A2; rss rolsüz)
binance:
  kataloglar: [161, 157, 49, 48]   # delist, bakım, haber, listeleme
kap:
  # A2 vetosu kalıcı değil: tedbirin kalkışı ayrı bildirimdir, olumsuz gelişme delist değildir. Başlangıç değerleri
  # (riski azaltan yönde, keyfi); A/B turnuvasında ölçülüp ayarlanır. Değişiklik = yeni deneme.
  veto_gun:
    pazar_tedbiri: 30
    olumsuz_esasli: 20
tarama:                            # servis turunda kaynak başına taranan son metin sayısı
  binance_duyuru: 200
  kap: 600                         # ~290 bildirim/gün
# RSS/Atom: geçmişi yok, yalnız son 15–35 öğe → erken toplanır (C özellikleri için birikir). Rol yok.
# sayfa: akış yalnız başlık veriyorsa bağlantıdaki sayfa indirilir; bolge: [baş, son] içerik bölgesi işaretleri.
rss:
  - {ad: coindesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", katalog: kripto_basin, aralik_dk: 10}
  - {ad: cointelegraph, url: "https://cointelegraph.com/rss", katalog: kripto_basin, aralik_dk: 10}
  - {ad: theblock, url: "https://www.theblock.co/rss.xml", katalog: kripto_basin, aralik_dk: 10}
  - {ad: decrypt, url: "https://decrypt.co/feed", katalog: kripto_basin, aralik_dk: 10}
  - {ad: fed_para, url: "https://www.federalreserve.gov/feeds/press_monetary.xml", katalog: merkez_bankasi,
     aralik_dk: 30, sayfa: true, bolge: ['id="article"', "<footer"]}
  - {ad: ecb_basin, url: "https://www.ecb.europa.eu/rss/press.html", katalog: merkez_bankasi, aralik_dk: 30,
     sayfa: true, bolge: ["<main", "</main>"]}
  - {ad: sec_basin, url: "https://www.sec.gov/news/pressreleases.rss", katalog: duzenleyici, aralik_dk: 30}
dongu_sn: 60
