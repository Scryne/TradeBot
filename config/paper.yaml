# Paper kolları (Faz 7). Kaynak: docs/turnuva/Paper-Listesi.md. Varyant = walk-forward'ın SON penceresinin seçimi
# (turnuva sonuç dosyalarındaki walk_forward.secimler[-1]; yılda bir aynı kuralla yeniden seçilir, yeni deneme sayılmaz).
# Değişiklik = yeni paper dönemi (defterde yeni kol kimliği). Tasarım: docs/Paper-Tasarim.md.

baslangic_ozkaynak: 100000        # kol başına sanal USDT (B: sermayesiz gözlem; dağıtıcıdan pay almaz)
jev_ab: true                      # her kol iki kopya: Jev vetolu (+jev) ve vetosuz
frenler: true                     # kol düzeyinde günlük −%3 / haftalık −%8 fren, −%25 acil (backtest ile aynı)

gruplar:
  kripto_btc_eth: {kimlikler: [BINANCE:BTCUSDT, BINANCE:ETHUSDT], asgari_gecmis_gun: 30, yon: long}

boyutlar:                         # dalga dosyalarındaki boyut bloğu, birebir
  dalga1: {hedef_vol: 0.20, kaldirac: 3.0, vol_pencere_gun: 30, bant: 0.25}
  dalga2: {hedef_vol: 0.20, kaldirac: 3.0, vol_pencere_gun: 90, bant: 0.25}

kollar:
  - {ad: "ma_yon@kripto_btc_eth@1h", strateji: ma_yon, grup: kripto_btc_eth, zd: 1h, boyut: dalga1,
     parametre: {hizli_gun: 10, yavas_gun: 50}, sinif: B}
  - {ad: "tsmom@kripto_btc_eth@4h", strateji: tsmom, grup: kripto_btc_eth, zd: 4h, boyut: dalga1,
     parametre: {ufuk_gun: 250}, sinif: B}
  - {ad: "d2:donchian_ls@kripto_btc_eth@4h", strateji: donchian_ls, grup: kripto_btc_eth, zd: 4h, boyut: dalga2,
     parametre: {giris_gun: 55, cikis_gun: 20}, sinif: B}
  - {ad: "d2:donchian_ls@kripto_btc_eth@1d", strateji: donchian_ls, grup: kripto_btc_eth, zd: 1d, boyut: dalga2,
     parametre: {giris_gun: 55, cikis_gun: 10}, sinif: B}
  - {ad: "d2:tsmom@kripto_btc_eth@4h", strateji: tsmom, grup: kripto_btc_eth, zd: 4h, boyut: dalga2,
     parametre: {ufuk_gun: 250}, sinif: B}

# Agresif gözlem kolu (Final Doküman §Sermaye dağıtıcı): tam Kelly, ayrı defter, dağıtıma girmez.
# Kelly: kolların backtest'i yıllık ~%19 getiri, ~%19 oynaklık → f* = μ/σ² ≈ 5 (aşağı yuvarlandı). Binance SPOT'ta kaldıraç
# yok ve risk motoru enstrüman başına 0,5, sınıf başına 1,0 izin verir: çarpan tavanlara takılır. Pratikte agresif kol
# "kolların ortalaması long ise o enstrümanda %50" demektir (vol hedefli kollar ~%20–30 taşır). Kararı her saat verir.
agresif:
  ad: "agresif@kripto_btc_eth"
  grup: kripto_btc_eth
  boyut: dalga1
  kelly_carpani: 5.0
  kaynaklar: ["ma_yon@kripto_btc_eth@1h", "tsmom@kripto_btc_eth@4h", "d2:donchian_ls@kripto_btc_eth@4h",
              "d2:donchian_ls@kripto_btc_eth@1d", "d2:tsmom@kripto_btc_eth@4h"]

# Sermaye dağıtıcı + portföy kolu (Final Doküman §Sermaye dağıtıcı; gerekçe docs/Paper-Tasarim.md; kod canli/dagitici.py).
# Haftalık (Pazartesi 00:00 UTC): ERC (korelasyonlu) × küçültülmüş üstünlük eğimi → yarım Kelly (≤ 3x) → kademe
# (4/8/12 hafta: %25/%50/%100). Yalnız A kolları sermaye alır; B'nin gölge ağırlığı kaydedilir, katsayısı 0.
# Kaynaklar Jev'li kopyalardır: gerçek parada Jev açık koşar; Jev'siz kopyalar kontrol grubudur.
# Önsel: walk-forward OOS Sharpe (turnuva sonuç dosyaları, 2026-09-27); dağıtıcı onsel_indirim ile yarıya indirir.
portfoy:
  ad: "portfoy@kripto_btc_eth"
  grup: kripto_btc_eth
  boyut: dalga1
  kaynaklar: ["ma_yon@kripto_btc_eth@1h+jev", "tsmom@kripto_btc_eth@4h+jev", "d2:donchian_ls@kripto_btc_eth@4h+jev",
              "d2:donchian_ls@kripto_btc_eth@1d+jev", "d2:tsmom@kripto_btc_eth@4h+jev"]
  onsel_sharpe:
    "ma_yon@kripto_btc_eth@1h+jev": 0.834
    "tsmom@kripto_btc_eth@4h+jev": 0.915
    "d2:donchian_ls@kripto_btc_eth@4h+jev": 0.829
    "d2:donchian_ls@kripto_btc_eth@1d+jev": 0.831
    "d2:tsmom@kripto_btc_eth@4h+jev": 0.958
  dagitici: {onsel_indirim: 0.5, onsel_gun: 365, asgari_gun: 28, pencere_gun: 180, kelly_kesri: 0.5}

# Kilit açılımı kolu (Dalga 6b, karar A; docs/turnuva/Dalga-6-Kilit.md). Ayrı düğüm (canli/kilit.py, compose `kilit`):
# Nautilus dışı, günde bir karar 00:05 UTC, saatte bir işaret. Açılımdan 7 gün önce token perp kısa + aynı nominalde BTC
# perp uzun, açılım günü kapanır. Risk motoru varsayılan tavanları: kol brütü ≤ 1x, BTC bacağı ≤ özkaynağın %50'si
# (en çok 5 açık olay). Dağıtıcıya girmez (portföy kolu yalnız BTC/ETH grubunu taşır). Jev vetosuz (v1).
# 2026-10-01: dalga 13'ün A kolu (eşik %0,5, nominal %5; Sharpe 0,99, DSR 0,98, 6b'nin iki katı olay) 6b'nin yerine
# geçti (ilk giriş öncesi, pozisyon yokken). 6b kolu defterde "durdur: yerine_d13" ile kapalı. docs/turnuva/Dalga-13-Kilit-Genis.md
kilit:
  ad: "d13:kilit_kisa@kilit_perp@1d"
  sinif: A
  kural: {giris: -7, cikis: 0, notional: 0.05}
  olay: {kategoriler: [insiders, privateSale], asgari_oran: 0.005}
  maliyet: {ucret: 0.0005, kayma_token: 0.001, kayma_btc: 0.0001}
  risk: {kaldirac: 1.0}

# Kilit kolunun GERÇEK yürütmesi (Faz 12; Roadmap 2026-10-01 kararı). Kural `kilit` ile aynı; ayrı kol ve düğüm
# (compose `kilit-gercek`, profil `gercek`), Binance USDⓈ-M'ye gerçek emir, net BTC koruması, funding ve komisyon
# borsanın gelir kaydından. `ortam: demo` Binance Demo Trading (para yok); `ana` gerçek para: `onay` doluysa çalışır
# (kural 7). Sermaye kodda sabit tavanlı (canli/kilit.GERCEK_SERMAYE_TAVANI, 2.000 USDT). Anahtar yalnız host .env'de.
kilit_gercek:
  ad: "d13:kilit_kisa@kilit_perp@1d#gercek"
  sinif: A
  ortam: demo
  sermaye: 1000
  onay: ""


# Döviz taşıma kolu (Dalga 9 KALDI; ön kayıt gereği ileriye dönük GÖZLEM kolu, docs/turnuva/Dalga-9-Doviz.md). Ayrı
# düğüm (canli/doviz.py, compose `doviz`): NCM forex DEMO hesabında gerçek MT5 emri. İş günü 07:00 UTC'de günde bir karar
# (NCM günlük barları + OECD faizi, backtest'in aynı fonksiyonları), saatte bir işaret + taşıma tahakkuku (demo swap 0:
# defter faiz farkı − kurum payı ile tahakkuk eder). Risk motoru varsayılan tavanları (brüt 1x, enstrüman 0,5).
# Başlangıç özkaynağı demo bakiyesi (9.999,40 USD, 2026-09-30). Dağıtıcıya girmez. Jev vetosuz (v1).
doviz:
  ad: "d9:doviz_tasima@g10_doviz@1d"
  sinif: B
  strateji: doviz_tasima
  parametre: {n: 1}
  semboller: {"VADELI:EURUSD": EURUSD, "VADELI:GBPUSD": GBPUSD, "VADELI:USDJPY": USDJPY, "VADELI:AUDUSD": AUDUSD,
              "VADELI:USDCAD": USDCAD, "VADELI:USDCHF": USDCHF}
  boyut: {hedef_vol: 0.10, vol_pencere_gun: 90, bant: 0.25}
  maliyet: {kayma_bps: 1.0, kurum_payi_yillik: 0.01}
  risk: {kaldirac: 1.0}
  yurutme_saat_utc: 7
  magic: 909
  baslangic_ozkaynak: 10000

# Altın M15 scalping kolu (EA tarzı gün içi XAUUSD; Scryne 2026-09-30, kanıt gösterildikten sonra demo kararı). Ayrı düğüm
# (canli/altin.py, compose `altin`): NCM forex DEMO hesabında MT5 emri, döviz koluyla aynı hesap (sihirli sayı ayrı).
# Strateji Altın M15 turnuvasının `kanal_kirilim` en iyi varyantı (docs/turnuva/Altin-M15.md; Sharpe −0,18, KALDI):
# ileriye dönük gözlem. Sabit 0,01 lot (1 ons): 10.000 USD'de altının en küçük birimi enstrüman tavanının sınırında.
# Martingale, pozisyon yığma, ≥ 5x yok (kural 6). Finansman CFD metal modeli (yıllık %4).
altin:
  ad: "am15:kanal_kirilim@xau_m15@15m"
  sinif: B
  sembol: GOLD
  strateji: kanal_kirilim
  parametre: {n: 48, sl_atr: 2.0, haber_dk: 0}
  lot: 0.01
  ons_lot: 100
  maliyet: {kayma_bps: 1.0, finansman_yillik: 0.04}
  risk: {kaldirac: 1.0}
  magic: 910
  baslangic_ozkaynak: 10000

# Mikro ivme skalpı (Scryne 2026-10-05, TikTok "5 $ → 731 $" Strategy Tester videosu; "evet çalıştır"): GÖZLEM deneyi.
# Ayrı düğüm (canli/skalp.py, compose `skalp`), NCM forex DEMO hesabı, sihirli sayı 912. Düzken son 10 sn'nin orta fiyat
# yönünde 0,01 lot; spread düşülmüş kâr +0,30 $/ons'ta, zarar fiyatın %0,03'ünde (~1,2 $/ons), 5 dk'da kapanır. Dolum
# MT5'in gerçek dolumu (ek kayma yok: deneyin sorusu gerçek spread). Sabit lot, martingale yok (kural 6).
skalp:
  ad: "sk10:mikro_ivme@xau_tik@10s"
  sinif: B
  sembol: GOLD
  strateji: mikro_ivme
  parametre: {bekleme_sn: 10, tp_usd: 0.30, sl_oran: 0.0003, azami_sn: 300}
  bitis_utc: "2026-10-06T18:07:00Z"   # deney bitişi (kol tanımına girmez: tanım değişirse defter yeni kol ister)
  lot: 0.01
  ons_lot: 100
  maliyet: {kayma_bps: 0.0, finansman_yillik: 0.04}
  risk: {kaldirac: 1.0}
  magic: 912
  baslangic_ozkaynak: 10000

# FOMC günü dolar kolu (Dalga 10 B; ön kayıt gereği demo GÖZLEM kolu, docs/turnuva/Dalga-10-Akis.md). Ayrı düğüm
# (canli/akis.py, compose `akis`): NCM forex DEMO hesabında MT5 emri, döviz ve altın kollarıyla aynı hesap (sihirli
# sayı ayrı). Planlı FOMC karar gününden önceki gün → karar günü, yedi yabancı paranın eşit sepeti uzun (USD kısa); yılda
# 8 olay. Karar bir bar gecikmeli (21:00 UTC gün devri spread'inden kaçınır; ön kayıtlı gecikme stresiyle aynı).
# Finansman backtest modeli (NCMFX:fx_sabit, %2; taşıma yok). Risk motoru varsayılan tavanları (brüt 1x, enstrüman 0,5).
akis:
  ad: "d10:fomc_dolar@g10_saatlik@1h"
  sinif: B
  strateji: fomc_dolar
  parametre: {pencere: "gun"}
  fomc_takvimi: config/fomc_planli.yaml
  semboller: {"DUKASCOPY:EURUSD": EURUSD, "DUKASCOPY:GBPUSD": GBPUSD, "DUKASCOPY:USDJPY": USDJPY,
              "DUKASCOPY:AUDUSD": AUDUSD, "DUKASCOPY:USDCAD": USDCAD, "DUKASCOPY:USDCHF": USDCHF,
              "DUKASCOPY:NZDUSD": NZDUSD}
  boyut: {hedef_vol: 0.10, vol_pencere_gun: 90, bant: 0.25}
  maliyet: {kayma_bps: 1.0, finansman_yillik: 0.02}
  risk: {kaldirac: 1.0}
  gecikme_bar: 1
  azami_spread_bps: 4.0
  spread_bekle_dk: 30
  magic: 911
  baslangic_ozkaynak: 10000
