[project]
name = "tradebot"
version = "0.1.0"
description = "Kurumsal, çok piyasalı, otonom trade sistemi (Scryne)"
readme = "README.md"
authors = [
    { name = "Scryne", email = "218348029+Scryne@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "borsapy>=0.11.0",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "nautilus-trader==2.0.0rc5",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "psycopg[binary]>=3",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "typesafe-sdk==0.7.1",
]

[project.scripts]
tradebot = "tradebot:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
