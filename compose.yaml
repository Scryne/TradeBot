# TradeBot servisleri. Kullanım: `docker compose up -d --build` (ayrıntı: docs/host/Kurulum.md)
# Tüm servislerde konteyner DNS'i public çözümleyicidir: ev router'ının DNS'i IPv6'sız adlarda 5–15 sn
# gecikiyor ve Nautilus'un 5 sn WebSocket zaman aşımını aşıyor (Spike 02).
name: tradebot

x-ortak: &ortak
  build: .
  image: tradebot:yerel
  dns: [1.1.1.1, 8.8.8.8]
  # Sabit DNS Docker Desktop'ın host.docker.internal kaydını gizliyor (MT5 köprüsü için gerekli): /etc/hosts'a yazılır
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped
  env_file: .env
  environment:
    TRADEBOT_ORTAM: ${TRADEBOT_ORTAM:-host}
    TRADEBOT_VERITABANI_URL: postgresql+psycopg://tradebot:${POSTGRES_PASSWORD}@postgres:5432/tradebot
    TRADEBOT_LOG_DIZINI: /app/log
    TRADEBOT_VERI_DIZINI: /app/data
    TRADEBOT_YEDEK_DIZINI: /yedek   # yalnız saglik bağlar (salt okunur); bekçi yedek yaşını denetler
    # İmajda git yok: kod sürümü host_guncelle.ps1'den gelir (deneme defteri her kayıtta tutar)
    TRADEBOT_KOD_SURUMU: ${KOD_SURUMU:-bilinmiyor}
    # MT5 köprüleri host Windows'ta, yalnız 127.0.0.1'de (Docker Desktop host.docker.internal'ı oraya yönlendirir)
    TRADEBOT_MT5_KOPRU_FOREX: http://host.docker.internal:8765
    TRADEBOT_MT5_KOPRU_VIOP: http://host.docker.internal:8766
  volumes:
    - veri:/app/data
    - log:/app/log
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  saat:
    # Sanal makine saatini NTP ile senkron tutar (docker/saat/Dockerfile). Yalnız SYS_TIME yetkisi.
    build: ./docker/saat
    image: tradebot-saat:yerel
    dns: [1.1.1.1, 8.8.8.8]
    cap_add: [SYS_TIME]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: tradebot
      TZ: UTC
    volumes:
      - pg:/var/lib/postgresql/data
    # Port dışarı açılmaz: yalnız konteynerler erişir (host'taki başka servislerle çakışma yok).
    # Elle erişim: docker compose exec postgres psql -U tradebot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebot -d tradebot"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  yedek:
    # Veritabanı yedeği (2026-09-27 denetimi: hiç yedek yoktu). Günde bir, 02:15 UTC'den sonra pg_dump (özel biçim),
    # pg_restore --list ile doğrulanır, 14 gün saklanır. Hedef Windows diski (C:\TradeBot\yedek): WSL sanal diskinden
    # ayrı dosya sistemi. guncelle.ps1 her dağıtımda son yedeği ana bilgisayara da çeker (evden ayrı kopya).
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["sh", "/yedek.sh"]
    environment:
      PGHOST: postgres
      PGUSER: tradebot
      PGDATABASE: tradebot
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      SAAT: "0215"
      SAKLA: "14"
      TZ: UTC
    volumes:
      - ./docker/yedek/yedek.sh:/yedek.sh:ro
      - ../yedek:/yedek
    depends_on:
      postgres: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  goc:
    <<: *ortak
    command: ["tradebot", "db", "yukselt"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  saglik:
    <<: *ortak
    # Bekçi: 5 dakikada bir sağlık + paper kalp atışı + gece işi + yedek yaşı + log triyajı → Telegram (tanımlıysa).
    command: ["tradebot", "saglik", "--dongu", "300"]
    volumes:
      - veri:/app/data
      - log:/app/log
      - ../yedek:/yedek:ro
    depends_on:
      goc: { condition: service_completed_successfully }

  telegram:
    <<: *ortak
    # Faz 9 D4: Scryne'ın mesajı → Jev komut yönlendirmesi (okuma; riski azaltan durdurma onaylı; riski artıran yalnız
    # /devam + onay). Yalnız TRADEBOT_TELEGRAM_SOHBET'e cevap verir.
    command: ["tradebot", "telegram", "calis"]
    depends_on:
      goc: { condition: service_completed_successfully }

  veri:
    <<: *ortak
    # Gece işi: her gün 01:30 UTC (04:30 TRT). --hemen: servis ilk kalktığında bir kez çalıştırır (ilk yükleme).
    command: ["tradebot", "veri", "zamanla", "--saat", "01:30", "--hemen", "--dukascopy-butce-dk", "900"]
    depends_on:
      goc: { condition: service_completed_successfully }

  zeka:
    <<: *ortak
    # Zekâ katmanı (Faz 6): Binance duyuruları → Jev (A1) → veto/uyarı olayları. Her 60 sn bir tur.
    command: ["tradebot", "zeka", "calis"]
    depends_on:
      goc: { condition: service_completed_successfully }

  pano:
    <<: *ortak
    # Faz 10: salt okunur web pano. Port yalnız 127.0.0.1'e açılır (LAN'a değil); telefona/ana bilgisayara Tailscale
    # taşır: host'ta bir kez `tailscale serve --bg 8080` (tools/host/pano_tailscale.ps1). Yedek dizini sağlık için.
    command: ["tradebot", "pano", "calis", "--port", "8080"]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - veri:/app/data
      - log:/app/log
      - ../yedek:/yedek:ro
    depends_on:
      goc: { condition: service_completed_successfully }

  paper:
    <<: *ortak
    # Faz 7: paper düğümü (Nautilus sandbox, Binance canlı veri). Kararlar her 1h kapanışında; defter PostgreSQL'de.
    # Duman testi 2026-09-27: 1h kolları karar → risk → sandbox dolum → defter uçtan uca çalıştı.
    command: ["tradebot", "paper", "calis"]
    depends_on:
      goc: { condition: service_completed_successfully }

volumes:
  pg:
  veri:
  log:
